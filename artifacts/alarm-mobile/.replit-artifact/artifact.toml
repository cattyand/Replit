kind = "mobile"
previewPath = "/alarm-mobile/"
title = "Alarm Manager Mobile"
description = "App Android nativa per creare e gestire sveglie, con profili, suonerie, vibrazione, posticipo e sincronizzazione con il backend Alarm Manager."
version = "1.0.0"
id = "artifacts/alarm-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/alarm-mobile/" ]
localPort = 19099

[services.development]
run = "pnpm --filter @workspace/alarm-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/alarm-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/alarm-mobile", "run", "serve" ]

[services.env]
PORT = "19099"
BASE_PATH = "/alarm-mobile/"

kind = "web"
previewPath = "/"
title = "Alarm Manager"
version = "1.0.0"
id = "artifacts/alarm-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18456

[services.development]
run = "pnpm --filter @workspace/alarm-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/alarm-app", "run", "build" ]
publicDir = "artifacts/alarm-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18456"
BASE_PATH = "/"
